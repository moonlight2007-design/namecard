<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>観測する名刺</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#e9e9e8; --fg:#2f2e30; --muted:#69686b; --line:#c6c5c7;
  --pane-a:#383738; --pane-b:#58575a; --on:#f2f1ee; --on-dim:#b9b8b6; --moon:#ece4cc;
  --sheet:#f7f7f6; --veil:rgba(30,29,31,.55);
  --jp:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161617; --fg:#e8e7e4; --muted:#9b9a9d; --line:#39383a;
    --pane-a:#2b2a2c; --pane-b:#434244; --sheet:#232224; --veil:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161617; --fg:#e8e7e4; --muted:#9b9a9d; --line:#39383a;
  --pane-a:#2b2a2c; --pane-b:#434244; --sheet:#232224; --veil:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--jp);font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.app{box-sizing:border-box;display:flex;flex-direction:column;gap:12px;height:100%;min-height:620px;padding:14px 16px}

/* Header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who{min-width:0}
.role{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
h1{margin:0;display:flex;flex-wrap:wrap;
