<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>観測する名刺</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#e9e9e8; --fg:#2f2e30; --muted:#69686b; --line:#c6c5c7;
  --pane-a:#383738; --pane-b:#58575a; --on:#f2f1ee; --on-dim:#b9b8b6; --moon:#ece4cc;
  --sheet:#f7f7f6; --veil:rgba(30,29,31,.55);
  --r:clamp(48px,22vw,120px);
  --jp:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161617; --fg:#e8e7e4; --muted:#9b9a9d; --line:#39383a;
    --pane-a:#2b2a2c; --pane-b:#434244; --sheet:#232224; --veil:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161617; --fg:#e8e7e4; --muted:#9b9a9d; --line:#39383a;
  --pane-a:#2b2a2c; --pane-b:#434244; --sheet:#232224; --veil:rgba(0,0,0,.6);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--jp);font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
.mono{font-family:var(--mono)}
.app{box-sizing:border-box;display:flex;flex-direction:column;gap:12px;height:100%;min-height:620px;padding-inline:16px;padding-block:14px}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who{min-width:0}
.role{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
h1{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:14px;font-weight:700;font-size:clamp(24px,6vw,32px);letter-spacing:.14em;line-height:1.25;text-wrap:balance}
h1 .en{font-family:var(--mono);font-weight:400;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.ket{margin-top:2px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.badge{font-size:10px;letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.badge[hidden]{display:none}
.btn{font:inherit;font-size:13px;min-height:36px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn:focus-visible,.handle:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.stage{position:relative;flex:1;min-height:380px;display:grid;grid-template-rows:1fr 1fr;border-radius:14px;overflow:hidden;background:var(--pane-a)}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden;color:var(--on)}
.a{background:var(--pane-a)}
.b{background:var(--pane-b)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:manipulation}
#flow{pointer-events:none;cursor:default}
.tag{position:absolute;top:16px;left:20px;right:60px;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11px;letter-spacing:.14em;color:var(--on-dim);pointer-events:none}
.tag .sub{letter-spacing:.04em;opacity:.8}
.out{position:absolute;left:20px;right:64px;pointer-events:none;text-shadow:0 0 14px var(--pane-a)}
.a .out{top:50px}
.b .out{top:44px;bottom:22px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;text-shadow:0 0 14px var(--pane-b)}
.lines{--fs:clamp(24px,5.8vw,44px);display:flex;flex-direction:column;gap:2px;transition:filter .08s linear}
.lines.cols{display:block;column-count:2;column-gap:18px}
.lines.cols .line{break-inside:avoid}
.line{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:12px;font-size:var(--fs);font-weight:700;line-height:1.18;letter-spacing:.04em;animation:rise .45s both}
.line span{text-wrap:balance;word-break:auto-phrase}
.line i{font-style:normal;font-size:12px;font-weight:400;color:var(--on-dim);letter-spacing:.04em}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.obsmsg{margin-top:6px;font-size:12px;min-height:1.4em;color:var(--moon)}

.kw{display:flex;flex-direction:column;gap:4px;min-width:0}
.kw[hidden]{display:none}
.kwl{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.kwt{margin:0;font-size:15px;line-height:1.7;letter-spacing:.04em;overflow-wrap:anywhere}
.kwt span{display:inline-block;max-width:100%}
.kwt span:not(:last-child)::after{content:"・";margin-inline:.3em;color:var(--muted)}

.meter{display:flex;align-items:center;gap:18px;min-width:0}
.meter svg{flex:none;width:112px;height:112px;color:var(--fg);overflow:visible}
.meter .txt{min-width:0;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.meter .gr{display:flex;align-items:baseline;gap:10px}
.meter .k{flex:none;min-width:6.2em;font-size:12px;letter-spacing:.04em}
.meter b{display:inline-block;min-width:3.6ch;font-size:26px;font-weight:500;line-height:1.3;letter-spacing:.02em;color:var(--fg);font-variant-numeric:tabular-nums}
.meter .g2{margin-top:2px;font-size:13px;letter-spacing:.06em;overflow-wrap:anywhere}

.rail{position:absolute;touch-action:none;color:var(--on);user-select:none;-webkit-user-select:none}
.rail::before{content:"";position:absolute;background:var(--on);opacity:.45}
.rail .lbl{position:absolute;font-size:10px;letter-spacing:.12em;opacity:.8;pointer-events:none;white-space:nowrap}
.handle{position:absolute;width:36px;height:36px;border-radius:50%;box-sizing:border-box;border:2px solid var(--on);background:var(--pane-a);transform:translate(-50%,-50%);cursor:grab;display:grid;place-items:center}
.handle::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--moon)}
.rail.drag .handle{cursor:grabbing;border-color:var(--moon)}
.rail{right:12px;top:58px;bottom:34px;width:36px}
.rail::before{left:calc(50% - 1px);top:0;bottom:0;width:2px}
.rail .lbl.s{top:-22px;left:50%;transform:translateX(-50%)}
.rail .lbl.e{bottom:-22px;left:50%;transform:translateX(-50%)}
.handle{left:50%}
@media (min-width:760px){
  .stage{grid-template-rows:none;grid-template-columns:1fr 1fr}
  .a .out{top:auto;bottom:84px}
  .b .out{top:44px;bottom:84px}
  .rail{left:14%;right:14%;top:auto;bottom:22px;width:auto;height:36px}
  .rail::before{left:0;right:0;top:calc(50% - 1px);bottom:auto;width:auto;height:2px}
  .rail .lbl.s{top:auto;bottom:-18px;left:0;transform:none}
  .rail .lbl.e{top:auto;bottom:-18px;left:auto;right:0;transform:none}
  .handle{top:50%}
}

.foot{display:flex;flex-direction:column;gap:6px}
.meet{margin:0;font-size:15px;font-weight:500;letter-spacing:.06em;text-wrap:balance;word-break:auto-phrase}
.mailrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.mail{font-size:13px;overflow-wrap:anywhere;user-select:all}
.fine{margin:0;font-size:11px;color:var(--muted)}

.sheet{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-end;background:var(--veil)}
.sheet[hidden]{display:none}
.panel{box-sizing:border-box;width:min(620px,100%);max-height:92%;overflow-y:auto;background:var(--sheet);color:var(--fg);border-radius:24px 24px 0 0;padding:20px 16px 28px;display:flex;flex-direction:column;gap:18px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel h2{margin:0;font-size:18px;letter-spacing:.06em}
.panel h3{margin:0 0 2px;font-size:14px;letter-spacing:.06em}
.hint{margin:0 0 10px;font-size:12px;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:5px;padding-block:8px;border-top:1px solid var(--line)}
.rowline{display:flex;align-items:center;gap:8px}
textarea{display:block;width:100%;resize:vertical;line-height:1.6}
details.fixed{border-top:1px solid var(--line);padding-top:10px}
details.fixed summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-size:14px;font-weight:700;letter-spacing:.06em}
.fixedbody{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input.full{width:100%}
#gate{z-index:30}
#gate input{width:100%}
.gmsg{min-height:1.4em;margin:0;font-size:12.5px;color:var(--fg)}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;font-size:16px;min-height:42px;box-sizing:border-box;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
input.q{flex:1}
input.w{width:72px;text-align:right}
.pct{font-size:13px;color:var(--muted)}
.del{font:inherit;font-size:18px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;flex:none;line-height:1}
.prev{font-size:11.5px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.prev b{color:var(--fg);font-weight:500}
select.fb{font-size:14px;min-height:38px}
.dayrow{display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;accent-color:var(--fg)}
.note{margin:0;font-size:11.5px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){
  .line{animation:none}
  .lines{transition:none}
}
</style>

<div class="app">
  <header class="head">
    <div class="who">
      <div class="role">観測する名刺</div>
      <h1><span>村井 陽介</span><span class="en">Yosuke Murai</span></h1>
      <div class="ket mono">|Ψ⟩ = c₁|位置⟩ + c₂|活動⟩</div>
      <div class="ket">見る角度によって、私の輪郭は変わる。</div>
    </div>
    <div class="tools">
      <span class="badge mono" id="badge">SAMPLE</span>
      <button class="btn" id="editBtn" type="button">編集</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <section class="pane a" id="paneA" aria-label="位置">
      <canvas id="map" aria-hidden="true"></canvas>
      <div class="tag mono"><span>POSITION · 位置</span><span class="sub" id="upd">更新 今日 · タップで観測</span></div>
      <div class="out">
        <div class="lines" id="linesA"></div>
        <div class="obsmsg" id="obsmsg" aria-live="polite"></div>
      </div>
    </section>
    <section class="pane b" id="paneB" aria-label="活動">
      <canvas id="flow" aria-hidden="true"></canvas>
      <div class="tag mono"><span>MOMENTUM · 活動</span></div>
      <div class="out">
        <div class="lines" id="linesB"></div>
      </div>
    </section>

    <div class="rail" id="rail" aria-hidden="false">
      <span class="lbl s mono">位置</span>
      <span class="lbl e mono">活動</span>
      <div class="handle" id="handle" role="slider" tabindex="0" aria-label="観測の向き：位置を見るか、活動を見るか" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="位置と活動の中間"></div>
    </div>
  </main>

  <div class="meter" aria-hidden="true">
    <svg viewBox="-72 -52 126 124">
      <defs><clipPath id="gclip"><rect x="-46" y="-46" width="92" height="92" rx="10"/></clipPath></defs>
      <rect x="-46" y="-46" width="92" height="92" rx="10" fill="none" stroke="currentColor" stroke-opacity=".3"/>
      <g clip-path="url(#gclip)">
        <line x1="-46" y1="0" x2="46" y2="0" stroke="currentColor" stroke-opacity=".3"/>
        <line x1="0" y1="-46" x2="0" y2="46" stroke="currentColor" stroke-opacity=".3"/>
        <ellipse id="gEll" cx="0" cy="0" rx="18" ry="18" fill="currentColor" fill-opacity=".8"/>
      </g>
      <text x="-52" y="0" text-anchor="end" dominant-baseline="central" font-size="11" font-family="var(--mono)" fill="currentColor" opacity=".85">ΔX</text>
      <text x="0" y="61" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="var(--mono)" fill="currentColor" opacity=".85">ΔP</text>
    </svg>
    <div class="txt mono">
      <div class="gr"><span class="k">位置の鮮明さ</span><b id="gX">50%</b></div>
      <div class="gr"><span class="k">活動の鮮明さ</span><b id="gP">50%</b></div>
      <div class="g2">ΔX · ΔP
